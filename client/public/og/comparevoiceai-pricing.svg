  <text x="80" y="326" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="25">Source-linked model pricing for the complete voice stack</text>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle">
